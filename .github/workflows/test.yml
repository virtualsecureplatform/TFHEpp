name: Test

on:
  push:

jobs:
  scheme-tests:
    name: ${{ matrix.scheme }}-${{ matrix.compiler }}-26.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        scheme: [tfhe, bfv, clpx, ckks]
        compiler: [gcc, clang]
        include:
          - scheme: tfhe
            build_targets: test_common test_tfhe
            test_dirs: common tfhe
          - scheme: bfv
            build_targets: test_bfv
            test_dirs: bfv
          - scheme: clpx
            build_targets: test_clpx
            test_dirs: clpx
          - scheme: ckks
            build_targets: test_ckks
            test_dirs: ckks
          - compiler: gcc
            compiler_flags: -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
          - compiler: clang
            compiler_flags: -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
    steps:
      - name: Install libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential g++ libomp-dev cmake ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y clang lld
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      # Configure, build, and run in a single step: -march=native and the
      # AVX-512 detection happen at configure time, so the binaries must be
      # built and executed on the same machine.
      - name: Build and run scheme tests
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=ON \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3" \
            -DCMAKE_C_FLAGS_RELEASE="-O3" \
            ${{ matrix.compiler_flags }}
          cmake --build build --target ${{ matrix.build_targets }}
          cd build
          # CKKS CI intentionally runs only the normal lightweight test
          # executables. Do not pass lvl6 keygen/run/all flags here; those
          # generate full bootstrap artifacts and exceed the storage budget.
          test/test.sh ${{ matrix.test_dirs }}

  tfhe-concrete:
    name: tfhe-concrete-gcc-26.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential g++ libomp-dev cmake ninja-build
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test TFHE concrete parameters
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=ON \
            -DUSE_CONCRETE=ON
          cmake --build build --target test_tfhe
          cd build
          test/test.sh tfhe

  tfhe-block-binary:
    name: tfhe-block-binary-gcc-26.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential g++ libomp-dev cmake ninja-build
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test TFHE block-binary parameters
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=ON \
            -DUSE_BLOCK_BINARY=ON \
            -DUSE_SUBSET_KEY=ON
          cmake --build build --target blockbinary_blindrotatefft blockbinary_nand
          build/test/tfhe/blockbinary_blindrotatefft
          build/test/tfhe/blockbinary_nand

  tfhe-raintt:
    name: tfhe-raintt-gcc-26.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential g++ libomp-dev cmake ninja-build
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and test RAINTT
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=ON \
            -DUSE_COMPRESS=ON
          cmake --build build --target raintt trlwerainttenc gatebootstrappingtlwe2tlweraintt
          build/test/common/raintt
          build/test/tfhe/trlwerainttenc
          build/test/tfhe/gatebootstrappingtlwe2tlweraintt

  tutorial:
    name: tutorial-gcc-26.04
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Install libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git build-essential g++ libomp-dev cmake ninja-build
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and run tutorial
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TUTORIAL=ON
          cmake --build build
          echo "12345" | ./build/tutorial/client
          echo "54321" | ./build/tutorial/cloud
          ./build/tutorial/verify
